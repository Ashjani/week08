name: 06 - Auto Rollback

on:
  repository_dispatch:
    types: [rollback-trigger]

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group koalatech-week09-rg --name aksweek09s224948386 --overwrite-existing

      - name: Determine affected service from alert
        id: service
        run: |
          POD="${{ github.event.client_payload.pod }}"
          SERVICE=$(echo "$POD" | sed -E 's/-[a-z0-9]+-[a-z0-9]+$//')
          echo "Rollback triggered for pod: $POD (namespace: ${{ github.event.client_payload.namespace }})"
          echo "service=$SERVICE" >> $GITHUB_OUTPUT

      - name: Roll back the deployment
        run: |
          set -e
          DEPLOY="${{ steps.service.outputs.service }}"
          NS="${{ github.event.client_payload.namespace }}"

          # Get current revision so we can skip it in the search
          CURRENT=$(kubectl get deployment $DEPLOY -n $NS -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}')

          # List all revision numbers, newest first
          REVISIONS=$(kubectl rollout history deployment/$DEPLOY -n $NS | awk 'NR>2 {print $1}' | sort -rn)

          TARGET=""
          for REV in $REVISIONS; do
            if [ "$REV" == "$CURRENT" ]; then
              continue
            fi
            TEMPLATE=$(kubectl rollout history deployment/$DEPLOY -n $NS --revision=$REV)
            if echo "$TEMPLATE" | grep -q "placeholder"; then
              continue
            fi
            if echo "$TEMPLATE" | grep -q "exit 1"; then
              continue
            fi
            TARGET=$REV
            break
          done

          if [ -z "$TARGET" ]; then
            echo "No known-good revision found to roll back to."
            exit 1
          fi

          echo "Rolling back $DEPLOY in $NS to revision $TARGET"
          kubectl rollout undo deployment/$DEPLOY -n $NS --to-revision=$TARGET
          kubectl rollout status deployment/$DEPLOY -n $NS --timeout=120s