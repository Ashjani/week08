apiVersion: apps/v1
kind: Deployment
metadata:
  name: koalatech-relay
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: koalatech-relay
  template:
    metadata:
      labels:
        app: koalatech-relay
    spec:
      containers:
        - name: relay
          image: acrweek09s224948386.azurecr.io/koalatech-relay:v1
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: relay-github-secret
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: koalatech-relay
  namespace: monitoring
spec:
  selector:
    app: koalatech-relay
  ports:
    - port: 5000
      targetPort: 5000