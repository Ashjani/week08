apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: koalatech-crashloop-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: crashloop-detection
      rules:
        - alert: PodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="staging"}[5m]) > 2
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash-looping in staging"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} has restarted more than 2 times in the last 5 minutes."